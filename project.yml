name: AtendeBem
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  AtendeBemKit:
    path: Packages/AtendeBemKit
settings:
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: pt-BR
    DEVELOPMENT_TEAM: FWVSMZ9APG
targets:
  AtendeBem:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: AtendeBemKit
        product: AtendeBemUI
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: io.atendebem.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AtendeBemCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/AtendeBemKit/Tests/AtendeBemCoreTests
    dependencies:
      - package: AtendeBemKit
        product: AtendeBemCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.atendebem.app.core-tests
        GENERATE_INFOPLIST_FILE: YES
  AtendeBemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AtendeBem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.atendebem.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AtendeBem:
    build:
      targets:
        AtendeBem: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - AtendeBemCoreTests
        - AtendeBemUITests
